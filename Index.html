<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PixelStore - Tienda de Videojuegos</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>

    <header>
        <div class="logo">🎮 PixelStore</div>
        <nav>
            <a href="#catálogo">Catálogo</a>
            <a href="#carrito" id="cart-btn">🛒 Carrito (<span id="cart-count">0</span>)</a>
        </nav>
    </header>

    <main>
        <section class="hero">
            <h1>Los mejores videojuegos al mejor precio</h1>
            <p>Explora nuestra colección y compra al instante.</p>
        </section>

        <section id="catálogo" class="products-grid">
            <!-- Tarjetas de juegos -->
            <div class="card">
                <img src="https://via.placeholder.com/300x200?text=Cyber+Quest" alt="Cyber Quest">
                <h3>Cyber Quest 2077</h3>
                <p class="price">$59.99</p>
                <button onclick="addToCart('Cyber Quest 2077', 59.99)">Añadir al Carrito</button>
            </div>

            <div class="card">
                <img src="https://via.placeholder.com/300x200?text=Fantasy+Realm" alt="Fantasy Realm">
                <h3>Fantasy Realm IX</h3>
                <p class="price">$49.99</p>
                <button onclick="addToCart('Fantasy Realm IX', 49.99)">Añadir al Carrito</button>
            </div>

            <div class="card">
                <img src="https://via.placeholder.com/300x200?text=Speed+Racer" alt="Speed Racer">
                <h3>Speed Racer Turbo</h3>
                <p class="price">$29.99</p>
                <button onclick="addToCart('Speed Racer Turbo', 29.99)">Añadir al Carrito</button>
            </div>
        </section>
    </main>

    <!-- Modal del Carrito -->
    <div id="cart-modal" class="modal">
        <div class="modal-content">
            <span class="close-btn" onclick="toggleCart()">&times;</span>
            <h2>Tu Carrito de Compras</h2>
            <ul id="cart-items"></ul>
            <p><strong>Total: $<span id="cart-total">0.00</span></strong></p>
            <button onclick="checkout()" class="checkout-btn">Finalizar Compra</button>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
